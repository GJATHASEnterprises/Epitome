name: Generate Assets

on:
  push:
    branches:
      - main
    # Regenerate assets automatically when generator inputs change.
    paths:
      - scripts/generate_3d_model.py
      - scripts/generate_image.py
      - scripts/requirements.txt
      - docs/**
  workflow_dispatch:

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generation dependencies
        run: |
          # Install from the pinned requirements file first.
          if ! pip install -r scripts/requirements.txt; then
            echo "::warning::requirements.txt install had failures; attempting fallback package installs."
            # Fallback installs for environments where optional/compiled deps fail.
            pip install matplotlib Pillow numpy trimesh pygltflib scipy ezdxf numpy-stl || {
              echo "::error::Fallback install for core generation dependencies failed."
              exit 1
            }
          fi
          pip install cadquery || echo "::warning::cadquery install failed; continuing because CAD exports have graceful fallbacks."

      - name: Create asset directories
        run: mkdir -p assets/export

      - name: Generate 3D model assets
        continue-on-error: false
        run: python scripts/generate_3d_model.py

      - name: Generate image assets
        continue-on-error: false
        run: python scripts/generate_image.py

      - name: Commit and push regenerated assets
        run: |
          # Only commit when generated assets actually changed.
          if git diff --quiet -- assets/; then
            echo "No asset changes detected."
            exit 0
          fi

          git add assets/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate assets [skip ci]"
          git push origin HEAD:main

      - name: Summarize generated assets
        if: always()
        run: |
          {
            echo "## Generated assets summary"
            echo
            if find assets -type f | grep -q .; then
              echo "| File | Size |"
              echo "|---|---:|"
              while IFS= read -r file; do
                size=$(du -h "$file" | cut -f1)
                echo "| \`$file\` | $size |"
              done < <(find assets -type f | sort)
            else
              echo "No files found under \`assets/\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
